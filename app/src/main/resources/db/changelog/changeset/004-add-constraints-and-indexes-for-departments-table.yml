databaseChangeLog:
  - changeSet:
      id: 004
      author: dk
      comment: "Add unique key index (name), foreign key constraint (user_id) to departments table"
      changes:
        - addUniqueConstraint:
            tableName: departments
            schemaName: finance_management
            indexName: uk_departments_name
            columnNames: name
        - addForeignKeyConstraint:
            baseTableName: departments
            baseTableSchemaName: finance_management
            baseColumnNames: responsible_user_id
            referencedTableName: users
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_departments_responsible_user_id
            onDelete: CASCADE