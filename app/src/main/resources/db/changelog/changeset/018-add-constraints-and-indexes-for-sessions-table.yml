databaseChangeLog:
  - changeSet:
      id: 018
      author: dk
      comment: "Add constraints and index to sessions table"
      changes:
        - addForeignKeyConstraint:
            baseTableName: sessions
            baseTableSchemaName: finance_management
            baseColumnNames: user_id
            referencedTableName: users
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_sessions_user_id
            onDelete: CASCADE
        - createIndex:
              tableName: sessions
              schemaName: finance_management
              constraintName: idx_sessions_refresh_token_hash
              columns:
                  - column:
                        name: refresh_token_hash