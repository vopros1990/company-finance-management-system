databaseChangeLog:
  - changeSet:
      id: 012
      author: dk
      comment: "Add foreign key constraints, index to transactions table"
      changes:
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseTableSchemaName: finance_management
            baseColumnNames: category_id
            referencedTableName: categories
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_transactions_category_id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseTableSchemaName: finance_management
            baseColumnNames: user_id
            referencedTableName: users
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_transactions_user_id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: transactions
            baseTableSchemaName: finance_management
            baseColumnNames: account_target_id
            referencedTableName: accounts
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_transactions_account_target_id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
              baseTableName: transactions
              baseTableSchemaName: finance_management
              baseColumnNames: account_from_id
              referencedTableName: accounts
              referencedTableSchemaName: finance_management
              referencedColumnNames: id
              constraintName: fk_transactions_account_from_id
              onDelete: RESTRICT
        - addForeignKeyConstraint:
              baseTableName: transactions
              baseTableSchemaName: finance_management
              baseColumnNames: counterparty_id
              referencedTableName: counterparties
              referencedTableSchemaName: finance_management
              referencedColumnNames: id
              constraintName: fk_transactions_counterparty_id
              onDelete: RESTRICT
        - addForeignKeyConstraint:
              baseTableName: transactions
              baseTableSchemaName: finance_management
              baseColumnNames: counterparty_id
              referencedTableName: transactions
              referencedTableSchemaName: finance_management
              referencedColumnNames: id
              constraintName: fk_transactions_reference_transaction_id
              onDelete: RESTRICT
        - createIndex:
            tableName: transactions
            schemaName: finance_management
            indexName: idx_transactions_type_status_processed_at_created_at
            columns:
              - column:
                  name: type
              - column:
                  name: status
              - column:
                  name: processed_at
              - column:
                  name: created_at