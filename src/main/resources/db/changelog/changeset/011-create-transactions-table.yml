databaseChangeLog:
  - changeSet:
      id: 011
      author: dk
      comment: "Create transactions table"
      changes:
        - createTable:
            tableName: transactions
            schemaName: finance_management
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_to_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_from_id
                  type: BIGINT
              - column:
                  name: counterparty_id
                  type: BIGINT
              - column:
                  name: reference_transaction_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ