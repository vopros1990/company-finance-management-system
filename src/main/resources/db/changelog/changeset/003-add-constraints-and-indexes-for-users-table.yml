databaseChangeLog:
  - changeSet:
      id: 003
      author: dk
      comment: "Add unique key index (email), foreign key constraint (department_id) to users table"
      changes:
        - addUniqueConstraint:
            tableName: users
            schemaName: finance_management
            indexName: uk_users_email
            columnNames: email
        - addForeignKeyConstraint:
            baseTableName: users
            baseTableSchemaName: finance_management
            baseColumnNames: department_id
            referencedTableName: departments
            referencedTableSchemaName: finance_management
            referencedColumnNames: id
            constraintName: fk_users_department_id
            onDelete: CASCADE