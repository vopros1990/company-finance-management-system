databaseChangeLog:
  - changeSet:
      id: 019
      author: dk
      comment: "Create department_user table"
      changes:
        - createTable:
            tableName: department_user
            schemaName: finance_management
            columns:
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false